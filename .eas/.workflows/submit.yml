name: Build and Submit Stores

on:
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android AAB
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android to Play Console
    type: submit
    needs:
      - build_android
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    name: Build iOS IPA
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    type: submit
    needs:
      - build_ios
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
